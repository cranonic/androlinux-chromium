plugins {
    id 'com.android.application'
}

android {
    namespace = "com.alpine.chrome"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.alpine.chrome"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        // Bump versionCode on every release so Android allows in-place update
        // without uninstall (preserves downloaded Chromium / rootfs data).
        versionCode 7
        versionName "1.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Keep binary assets uncompressed (rootfs archives, native libs)
        androidResources {
            noCompress 'gz', 'tar', 'tar.gz', 'tgz', 'zip', 'so', 'so.2'
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    signingConfigs {
        // Stable project keystore — same signature across builds → in-place updates
        release {
            def ksPath = System.getenv("STORE_FILE")
            if (ksPath == null || ksPath.isEmpty()) {
                ksPath = "${projectDir}/keystore/chromium-release.jks"
            }
            def ksFile = file(ksPath)
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("STORE_PASSWORD") ?: "chromium123"
                keyAlias System.getenv("KEY_ALIAS") ?: "chromium"
                keyPassword System.getenv("KEY_PASSWORD") ?: "chromium123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Always sign when keystore is present (local + CI)
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Same applicationId as release so installs update in place
            // (no ".debug" suffix — that forced uninstall + re-download).
            versionNameSuffix "-debug"
            // Sign debug with the same key so switching debug↔release still updates
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.core:core:${rootProject.ext.androidxCoreVersion}"
    implementation "com.google.android.material:material:${rootProject.ext.materialVersion}"
    implementation "androidx.constraintlayout:constraintlayout:${rootProject.ext.constraintLayoutVersion}"
    implementation "androidx.lifecycle:lifecycle-runtime:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-viewmodel:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.activity:activity:${rootProject.ext.activityVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashScreenVersion}"
    implementation "androidx.webkit:webkit:1.12.1"
}
