name: Alpine Chrome Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses || true

      # Optional: drop prebuilt proot libs into jniLibs if not committed
      - name: Verify native libs (proot)
        run: |
          echo "Expected under app/src/main/jniLibs/arm64-v8a/ :"
          echo "  libproot.so  libproot-loader.so  libtalloc.so  libtalloc.so.2"
          ls -la app/src/main/jniLibs/arm64-v8a/ || echo "(empty — copy binaries before release build)"

      - name: Make gradlew executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Build Debug APK
        working-directory: .
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            # Bootstrap wrapper if missing
            gradle wrapper --gradle-version 8.9 || true
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Build Release APK (unsigned if no secrets)
        working-directory: .
        env:
          STORE_FILE: ${{ secrets.STORE_FILE && 'app/release.keystore' || '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            export STORE_FILE=app/release.keystore
            ./gradlew :app:assembleRelease --stacktrace
          else
            echo "No KEYSTORE_BASE64 secret — skipping signed release"
            ./gradlew :app:assembleRelease --stacktrace || ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AlpineChrome-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
